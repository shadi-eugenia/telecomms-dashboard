<div class="table-container">
  <!-- Filter - Label outside the input -->
  <div class="filter-container">
    <div class="filter-wrapper">
      <label class="filter-label" for="searchInput">
        
        Search by Site or Owner
      </label>
      <div class="search-input-wrapper">
        <input 
          id="searchInput"
          class="search-input"
          type="text"
          (input)="applyFilter($event)" 
          (keyup)="'Keyup fired!'"
          placeholder="Type to filter..."
          #filterInput
          [value]="filterValue()">
          <mat-icon class="search-icon">search</mat-icon>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="mat-elevation-z8 table-wrapper">
    <table mat-table [dataSource]="workOrders()" matSort>

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let order">{{ order.id }}</td>
      </ng-container>

      <ng-container matColumnDef="site">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Site</th>
        <td mat-cell *matCellDef="let order">{{ order.site }}</td>
      </ng-container>

      <ng-container matColumnDef="region">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Region</th>
        <td mat-cell *matCellDef="let order">
              <span [class]="'region-' + order.region.toLowerCase()">
                {{ order.region }}
              </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let order">
              <span [class]="'status-' + order.status.toLowerCase().replace(' ', '-')">
                {{ order.status }}
              </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="priority">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Priority</th>
        <td mat-cell *matCellDef="let order">
          <span class="priority-{{ order.priority }}">{{ order.priority }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="owner">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Owner</th>
        <td mat-cell *matCellDef="let order">{{ order.owner }}</td>
      </ng-container>

      <ng-container matColumnDef="slaDueAt">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>SLA Due</th>
        <td mat-cell *matCellDef="let order">
              <span [class.overdue]="isOverdue(order.slaDueAt)">
                {{ order.slaDueAt | date:'MMM d, y' }}
              </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="progressPct">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Progress</th>
        <td mat-cell *matCellDef="let order">
          <div class="progress-bar-container">
            <div class="progress-bar" [style.width.%]="order.progressPct"></div>
            <span class="progress-text">{{ order.progressPct }}%</span>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let order">
          <button mat-icon-button color="primary" (click)="onEdit.emit(order)" title="Edit status">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="onDelete.emit(order.id)">
            <mat-icon>delete_outline</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row
          *matRowDef="let row; columns: displayedColumns;">
      </tr>
    </table>
  </div>
</div>
